            <a routerLink="/dashboard" routerLinkActive="bg-slate-800 text-white" 
               class="px-3 py-2 rounded-md text-sm font-medium text-slate-300 hover:text-white transition-colors">

            </a>
          }

          <a routerLink="/devices" routerLinkActive="bg-slate-800 text-white"

          </a>

          @if (auth.isAdmin) {
            <a routerLink="/personnel" routerLinkActive="bg-slate-800 text-white" 
               class="px-3 py-2 rounded-md text-sm font-medium text-slate-300 hover:text-white transition-colors cursor-pointer">

          <span class="text-[10px] font-bold text-blue-400 uppercase tracking-widest mb-1">Active Role Profile</span>

            [value]="auth.currentRole"
